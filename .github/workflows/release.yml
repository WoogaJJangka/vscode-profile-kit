name: Release

# Publishes to the VS Code Marketplace with Trusted Publishing (OIDC, `vsce publish --oidc`); no PAT is stored.
# Runs when a tag vX.Y.Z is pushed. The tag must match package.json's version.
# An odd minor version (0.1.x, 0.3.x, ...) is published as a pre-release, an even one as a release
# (the Marketplace's recommended versioning for pre-releases).
#
# One-time setup by the publisher owner (docs/RELEASE.md):
#   Marketplace > publisher > Trusted Publishing > Create:
#   owner WoogaJJangka, repository vscode-profile-kit, workflow release.yml, environment marketplace

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # add required reviewers to this environment in the repository settings to approve each publish
    environment: marketplace
    permissions:
      contents: read
      id-token: write # vsce requests a GitHub OIDC token for the Marketplace

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # media/icon.png is in Git LFS; without it the VSIX gets the pointer file instead of the icon
          lfs: true
          persist-credentials: false

      # same major as environment.yml (vsce 4 needs Node 22 or later)
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        # no lifecycle scripts (SonarQube S6505); esbuild works from its platform package without them
        run: npm ci --ignore-scripts

      - name: Check (typecheck, lint, format, unit tests)
        run: npm run check

      - name: Read version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          minor=$(echo "$version" | cut -d. -f2)
          if [ $((minor % 2)) -eq 1 ]; then echo "flag=--pre-release" >> "$GITHUB_OUTPUT"; else echo "flag=" >> "$GITHUB_OUTPUT"; fi

      # vscode:prepublish runs typecheck and the production build
      - name: Package VSIX
        run: ./node_modules/.bin/vsce package --no-dependencies ${{ steps.version.outputs.flag }} -o vscode-profile-kit.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ github.ref_name }}
          path: vscode-profile-kit.vsix

      - name: Publish to the Marketplace (OIDC)
        run: ./node_modules/.bin/vsce publish --oidc --packagePath vscode-profile-kit.vsix ${{ steps.version.outputs.flag }}

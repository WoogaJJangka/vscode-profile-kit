name: Bug report
description: Something in Profile Kit does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Profile Kit uses a few VS Code internals that are not public API (README, "Support"). After a VS Code update
        they can change, so the versions below matter most.
  - type: input
    id: vscode
    attributes:
      label: VS Code version
      description: Help > About (or `code --version`). Stable or Insiders?
      placeholder: 1.147.0 (stable)
    validations:
      required: true
  - type: input
    id: kit
    attributes:
      label: Profile Kit version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The steps, the command or button you used, and what you saw.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Profile Kit output
      description: |
        View > Output > "Profile Kit". The first line has the VS Code version and the version Profile Kit's use of
        VS Code internals was checked on. Remove paths or names you do not want to share.
      render: text
  - type: textarea
    id: preset
    attributes:
      label: Preset (if it matters)
      description: The part of your preset file that is involved.
      render: jsonc

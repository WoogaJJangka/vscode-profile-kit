# SonarQube Cloud settings, read by the CI analysis of .github/workflows/sonar.yml (which copies this file to
# sonar-project.properties). Automatic Analysis must stay off: SonarQube Cloud runs one or the other, not both.

# Our own code and tests. scripts/legacy/ holds the original PowerShell scripts (kept as they were, docs/PLAN.md).
sonar.sources=src,media
sonar.tests=test
sonar.exclusions=scripts/legacy/**,dist/**,l10n/**

# Coverage counts what the unit tests can run. src/ui/ and the entry point use the VS Code API and run only inside
# VS Code (tried by hand in an isolated VS Code, CLAUDE.md); media/ is the webview's stylesheet and icons.
# scripts/compat/ runs against a real VS Code in .github/workflows/compat.yml, and esbuild.mjs is the build itself.
sonar.coverage.exclusions=src/ui/**,src/extension.ts,media/**,scripts/**,esbuild.mjs

sonar.sourceEncoding=UTF-8
